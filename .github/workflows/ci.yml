name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jdk-compatibility:
    name: JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java:
          - "8"
          - "11"
          - "17"
          - "21"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Clean verify
        run: mvn --batch-mode --no-transfer-progress clean verify

  swift-compatibility:
    name: Swift ${{ matrix.swift }} / JDK 8
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        swift:
          - "0.19.2"
          - "0.20.0"
          - "0.21.1"
          - "0.22.1"
          - "0.23.1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven

      - name: Clean verify against Swift ${{ matrix.swift }}
        run: mvn --batch-mode --no-transfer-progress -Dswift.version=${{ matrix.swift }} clean verify

  maven-demo:
    name: Maven demo case matrix / JDK 8
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven

      - name: Run Maven demo case matrix
        run: sh examples/maven/run-demo.sh
