name: Publish to Maven Central

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK and Maven Central credentials
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD

      - name: Verify release version
        shell: bash
        run: |
          version="$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)"
          if [[ "$version" == *-SNAPSHOT ]]; then
            echo "Refusing to publish snapshot version: $version" >&2
            exit 1
          fi
          echo "Publishing io.github.ezraio:thrift-annotation-lint:$version"

      - name: Build, sign, and upload for validation
        run: mvn --batch-mode --no-transfer-progress -Prelease clean deploy
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
